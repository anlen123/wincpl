# 剪藏配置（UTF-8 编码；使用空格缩进，不要用 Tab）。
# 首次运行生成：%LOCALAPPDATA%\com.winctl.jianzang\config.yaml。
# 修改此示例不会改变已安装应用；请从托盘菜单“编辑 YAML 配置”打开实际文件。
# 保存后点“重新加载配置”；新增配置字段后升级旧程序建议先退出再启动新版。
# 不支持的字段、非法范围、快捷键冲突会报错，不会静默使用另一套快捷键。
# 同目录 history.sqlite3 保存历史和代码片段，images/、thumbnails/ 保存图片。

hotkeys:
  # 全局快捷键：即使剪藏没有焦点也能呼出；在同一面板再次按下则隐藏。
  # Ctrl=控制键，Alt=替换键，Shift=上档键；+ 表示同时按，不是先后按。
  # Super 是 Windows 徽标键（通常在 Ctrl 与 Alt 之间），不是另一个物理键。
  # Windows 保留 Win+V 等组合，不能保证注册成功；本程序不再用键盘钩子强行接管。
  # 推荐 Ctrl+Alt+字母，示例 Ctrl+Alt+V、Ctrl+Alt+C；避免和其他软件冲突。
  # 两个呼出键不能相同；修改时允许互换两个面板的组合。
  toggle: "Ctrl+Alt+V" # 剪贴板历史，按复制文字/OCR 图片文字搜索。
  snippets: "Ctrl+Alt+S" # 代码片段，搜索标题，粘贴保存的完整内容。
  # 下面不是呼出键，也不是在面板中按的按键：它是选中后发送给目标软件的组合。
  # 面板仍用上下键选择、Enter 或左键粘贴、Esc 隐藏。
  # Shift+Insert 适合部分终端；普通软件可改 Ctrl+V。目标软件必须支持该组合。
  # 支持 Ctrl/Alt/Shift/Super 修饰键 + 一个普通键，如 V、Insert、Enter、F1..F24。
  # 不支持连续宏、多段组合或文字命令。普通权限无法可靠粘贴到管理员窗口。
  paste: "Shift+Insert"

appearance:
  # 颜色使用 CSS 格式："#RRGGBB" 或 "rgba(红, 绿, 蓝, 透明度)"。
  # RGB 分量 0..255，透明度 0..1；值加引号，避免 # 被 YAML 当作注释。
  text_color: "#28332D" # 主文字、列表正文、输入文字。
  muted_color: "#6B756F" # 时间、辅助状态等次要文字。
  background_color: "rgba(247, 242, 228, 0.78)" # 窗口背景；透明度越小越透。
  selected_color: "rgba(221, 232, 218, 0.92)" # 当前选中行的背景。
  selected_border_color: "#789080" # 选中行与聚焦输入框的边框。
  card_color: "rgba(255, 253, 246, 0.76)" # 普通列表行、输入框及按钮背景。
  border_color: "rgba(61, 77, 68, 0.16)" # 分隔线和普通控件边框。
  accent_color: "#587461" # 选中标记、强调图标与状态文字。
  # 字体按逗号顺序回退；请保留中文字体，否则某些机器可能显示方框。
  font_family: "Segoe UI Variable, Microsoft YaHei UI, sans-serif"
  font_size: 13 # 主字体逻辑像素，10..32；调大会增高列表行，减少首屏可见项。
  width: 400 # 窗口逻辑像素宽，280..1200；不是物理屏幕像素。
  height: 560 # 窗口逻辑像素高，320..1200；默认尺寸和字号首屏约十项。
  # Windows DPI 缩放会改变物理大小；毛玻璃实际效果还受系统透明效果设置影响。

history:
  # 单次列表/搜索最多返回 1..100 条；超过首屏可见数量可滚动查看。
  # 同时用于片段列表结果数量；搜索先覆盖全部数据，再限制返回条数。
  display_limit: 20
  # 剪贴板历史保留 1..5000 条；超过后删除最旧记录及其图片文件。
  # 缩小此值并重新加载会立即清理旧历史，不可撤销。不会删除代码片段。
  # 相同文字/图片只保留一条，重复复制或粘贴历史项会置顶。
  max_items: 100
  # 每张图片解码后的像素内存上限（MiB），1..128；不是 PNG 压缩文件大小。
  # 大图超过上限不采集；默认 64 MiB 约能容纳 1600 万 RGBA 像素。
  max_image_mb: 64
  # 每条剪贴板文字 UTF-8 字节上限（KiB），1..1024，超出不采集。
  # 中文通常每字占多个字节；片段另限标题 200 字符、正文 100000 字符。
  max_text_kb: 256

ocr:
  # Windows.Media.Ocr 本机离线文字识别，不上传图片，不理解无字照片场景。
  # 使用已安装的 Windows OCR 语言标签，常见 zh-Hans、zh-Hant、en-US。
  # 语言包：Windows 设置 > 时间和语言 > 语言和区域 > 语言选项。
  # 未安装会显示具体失败原因；修改语言后在设置中重新识别所选图片。
  # 小图片原尺寸无结果时自动放大两倍重试一次；识别正文参与历史搜索。
  language: "zh-Hans"

# 代码片段由面板新增/编辑/删除，不在 YAML 中编写正文。
# Ctrl+Alt+S 呼出后点 + 新建，标题唯一；选择片段后可编辑、删除或粘贴。
# 片段长期保存，不受 max_items 限制，清空剪贴板历史也不删除片段。
# 内容按纯文本保存和粘贴，保留缩进/换行，不执行代码，也不做变量替换。
# 数据库未加密，不建议长期保存密码和密钥；备份时应退出程序并复制整个数据目录。
